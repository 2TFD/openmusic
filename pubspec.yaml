name: owlsonic
description: "OwlSonic: a cross-platform personal music library with local-first playback, Mood Map and Wave."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  bloc: ^9.2.0
  equatable: ^2.0.8
  easy_localization: ^3.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.18
  audio_service_win: ^0.0.3
  audio_service_mpris: ^0.2.1
  path_provider: ^2.1.0
  path: ^1.9.1
  uuid: ^4.5.3
  youtube_explode_dart: ^3.1.0
  file_picker: ^10.3.10
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  flutter_launcher_icons: ^0.14.4
  html: ^0.15.6
  dio: ^5.9.2
  lottie: ^3.3.3
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  drift: ^2.33.0
  sqlite3: ^3.3.1
  drift_flutter: ^0.3.0
  background_downloader: ^9.5.9
  get_it: ^9.2.1
  share_plus: ^12.0.2
  sentry_flutter: ^9.29.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  posthog_flutter: ^5.50.0
  desktop_drop: ^0.8.4
  connectivity_plus: ^7.3.1

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.33.0
  http_parser: ^4.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/translations/

flutter_icons:
  image_path: "assets/icon/owlsonic_app_icon.png"
  android: true
  ios: true
